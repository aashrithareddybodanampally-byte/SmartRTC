<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartRTC - Register</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
    <div class="login-container">
        <div class="glass-card login-card">
            <a href="landing.html" class="back-link">← Back to Home</a>
            <div class="login-header">
                <div class="login-logo">🚌</div>
                <h1 style="margin-bottom: 0.5rem;">SmartRTC Registration</h1>
                <p style="color: var(--text-secondary);">Register for a new account</p>
            </div>

            <form id="registrationForm">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-input" id="full_name" name="full_name"
                        placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-input" id="username" name="username" placeholder="Choose a username"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="password" name="password"
                        placeholder="Create a password" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="email" name="email" placeholder="Enter your email"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-input" id="phone" name="phone" placeholder="Enter your phone number"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label">Designation</label>
                    <select class="form-input" id="designation" name="designation" required>
                        <option value="">Select Designation</option>
                        <option value="driver">Driver</option>
                        <option value="conductor">Conductor</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">TSRTC Employee ID</label>
                    <input type="text" class="form-input" id="employee_id" name="employee_id"
                        placeholder="e.g., TSRTC123456" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    Register Account
                </button>
            </form>

            <div style="margin-top: 2rem; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
                <p>Already have an account? <a href="index.html"
                        style="color: var(--primary-color); text-decoration: none;">Login here</a></p>
            </div>

            <div style="margin-top: 1.5rem; text-align: center; color: var(--text-muted); font-size: 0.85rem;">
                <p>Enterprise Transport Analytics Platform</p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                full_name: document.getElementById('full_name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                designation: document.getElementById('designation').value,
                employee_id: document.getElementById('employee_id').value
            };

            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Registering...';

            try {
                const response = await fetch(`${window.API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    TSRTC.notify.success('Registration submitted successfully!');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    TSRTC.notify.error(data.detail || 'Registration failed');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Register Account';
                }
            } catch (error) {
                console.error('Error:', error);
                TSRTC.notify.error('Registration failed. Please try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register Account';
            }
        });
    </script>
</body>

</html>
